<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Tech Dashboard</title>
<style>
  :root {
    --bg-main: #0a0b10;
    --bg-panel: #12141d;
    --bg-panel-header: #1a1d27;
    --text-main: #ffffff;
    --text-muted: #8b949e;
    --accent-blue: #3b82f6;
    --accent-purple: #8b5cf6;
    --border-color: #2d3748;
  }
  body {
    margin: 0;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  
  /* Slimmed Top Nav */
  #top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 20px;
    background-color: #11141e;
    border-bottom: 1px solid var(--border-color);
    height: 45px;
  }
  .nav-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    background: #1f2937;
    color: white;
    border: 1px solid var(--border-color);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: background 0.2s;
  }
  button:hover:not(:disabled) { background: #374151; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .active-btn { background: var(--accent-blue); border-color: var(--accent-blue); }
  
  #double-show-banner {
    display: none;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.3);
    margin: 10px 20px 0;
    padding: 8px 15px;
    border-radius: 6px;
    align-items: center;
    justify-content: space-between;
  }
  .banner-text {
    color: var(--accent-purple);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .show-selector { display: flex; gap: 8px; }

  #main-content {
    flex: 1;
    padding: 15px 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow: hidden;
  }
  
  /* New Header Layout */
  #show-header-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 5px;
  }
  #show-title-display {
    font-size: 34px;
    font-weight: 900;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-main);
  }
  #show-meta-area {
    display: flex;
    gap: 15px;
    background: #0d0f16;
    border: 1px solid #1f2937;
    padding: 8px 15px;
    border-radius: 8px;
  }
  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .meta-label {
    font-size: 9px;
    color: var(--accent-blue);
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .meta-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
  }

  /* Dashboard Grid */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    gap: 15px;
    flex: 1;
    min-height: 0;
  }
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    background: var(--bg-panel-header);
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border-color);
  }
  .panel-content {
    padding: 10px;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-content: flex-start;
    gap: 8px;
    overflow: hidden; /* Disabled scrolling */
  }
  .panel-content.single-col {
    grid-template-columns: 1fr;
  }
  .data-group {
    background: #0d0f16;
    border: 1px solid #1f2937;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .full-width {
    grid-column: 1 / -1;
  }
  .data-label {
    font-size: 8px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .data-value {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.2;
  }
  .empty-val { color: #4b5563; font-weight: 400; }
</style>
</head>
<body>

<div id="top-nav">
  <div class="nav-title">
    <span style="background: var(--accent-blue); padding: 3px 6px; border-radius: 4px; color: white; font-size: 12px;">TECH DASHBOARD</span>
    <span id="loaded-status" style="font-size: 11px; color: var(--text-muted); font-weight: normal;">Loading data...</span>
  </div>
  <div class="nav-controls">
    <button onclick="changeDate(-1)">&#8592; Prev</button>
    <button onclick="changeDate(1)">Next &#8594;</button>
  </div>
</div>

<div id="double-show-banner">
  <div class="banner-text">DOUBLE SHOW DAY &mdash; Multiple events on this date:</div>
  <div class="show-selector" id="show-selector-buttons"></div>
</div>

<div id="main-content">
  <div id="show-header-area">
    <h1 id="show-title-display">Loading Show...</h1>
    <div id="show-meta-area">
      <div class="meta-item">
        <span class="meta-label">Date</span>
        <span class="meta-value" id="meta-date">-</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Promotor</span>
        <span class="meta-value" id="meta-promotor">-</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Rep</span>
        <span class="meta-value" id="meta-rep">-</span>
      </div>
    </div>
  </div>
  
  <div class="dashboard-grid">
    <div class="panel">
      <div class="panel-header">1 &bull; Staff on the Day</div>
      <div class="panel-content" id="panel-staff"></div>
    </div>
    <div class="panel">
      <div class="panel-header">2 &bull; Access, Load-In & Times</div>
      <div class="panel-content" id="panel-access"></div>
    </div>
    <div class="panel">
      <div class="panel-header">3 &bull; Parking, Admin & Extra Notes</div>
      <div class="panel-content" id="panel-parking"></div>
    </div>
    <div class="panel">
      <div class="panel-header">4 &bull; Risers Required</div>
      <div class="panel-content" id="panel-risers"></div>
    </div>
    <div class="panel">
      <div class="panel-header">5 &bull; Audio & LX Requirements</div>
      <div class="panel-content" id="panel-audiolx"></div>
    </div>
    <div class="panel">
      <div class="panel-header">6 &bull; Post-Show Setup Instructions</div>
      <div class="panel-content single-col" id="panel-post"></div>
    </div>
  </div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTgVZRHRjrtZCMkzzd8bIlSqVE81Yori6toV_peAXIrn1gzuJXJvRhv8kixtnPrNyJac73k5SBwys7N/pub?gid=0&single=true&output=csv';
  
  let showsByDate = {};
  let dates = [];
  let currentDateIndex = 0;
  let activeShowIndexOnDate = 0;
  
  let headers = [];
  let dateIndex = -1;
  let titleIndex = -1;
  let headerGroups = { staff: [], access: [], parking: [], risers: [], audiolx: [], post: [] };

  function parseCSV(text) {
    let lines = [];
    let currentLine = [];
    let currentCell = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], nc = text[i+1];
      if (c === '"' && inQuotes && nc === '"') { currentCell += '"'; i++; }
      else if (c === '"') { inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes) { currentLine.push(currentCell.trim()); currentCell = ''; }
      else if ((c === '\n' || (c === '\r' && nc === '\n')) && !inQuotes) {
        currentLine.push(currentCell.trim());
        lines.push(currentLine);
        currentLine = []; currentCell = '';
        if (c === '\r') i++;
      } else { currentCell += c; }
    }
    if (currentCell || currentLine.length > 0) {
      currentLine.push(currentCell.trim());
      lines.push(currentLine);
    }
    return lines;
  }

  function groupHeadersByKeyword() {
    headerGroups = { staff: [], access: [], parking: [], risers: [], audiolx: [], post: [] };
    
    headers.forEach((h, idx) => {
      if (idx === dateIndex || idx === titleIndex || !h.trim()) return;
      const lower = h.toLowerCase();
      
      // Exclude Promotor and Rep from the grid (they are moved to the top right header)
      if (lower.includes('promotor') || lower.includes('promoter') || lower === 'rep' || lower.startsWith('rep ')) {
        return;
      }
      
      if (lower.match(/post|setup|night/)) {
        headerGroups.post.push(h);
      } else if (lower.match(/tech|crew|runner|manager|staff/)) {
        headerGroups.staff.push(h);
      } else if (lower.match(/access|load|door|curfew|time|support/)) {
        headerGroups.access.push(h);
      } else if (lower.match(/riser/)) {
        headerGroups.risers.push(h);
      } else if (lower.match(/audio|lx|light|power|sfx/)) {
        headerGroups.audiolx.push(h);
      } else {
        headerGroups.parking.push(h); 
      }
    });
  }

  async function fetchData() {
    try {
      const response = await fetch(CSV_URL);
      const data = await response.text();
      const rows = parseCSV(data);
      if (rows.length < 2) return;

      headers = rows[0];
      
      dateIndex = headers.findIndex(h => h.toLowerCase().includes('date'));
      titleIndex = headers.findIndex(h => h.toLowerCase().includes('show') && !h.toLowerCase().includes('post'));
      if (dateIndex === -1) dateIndex = 0;
      if (titleIndex === -1) titleIndex = 1;

      groupHeadersByKeyword();
      showsByDate = {};
      let loadedCount = 0;
      
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].length < 2 || !rows[i].join('').trim()) continue;
        const r = rows[i];
        const dateKey = r[dateIndex] || 'Unscheduled';
        
        let show = {};
        headers.forEach((h, idx) => { show[h] = r[idx] || ''; });

        if (!showsByDate[dateKey]) showsByDate[dateKey] = [];
        showsByDate[dateKey].push(show);
        loadedCount++;
      }

      dates = Object.keys(showsByDate);
      document.getElementById('loaded-status').innerText = `Loaded (${loadedCount} Shows)`;
      
      if (dates.length > 0) renderCurrentDate();
      else document.getElementById('show-title-display').innerText = 'Sheet is empty';
    } catch (error) {
      document.getElementById('show-title-display').innerText = 'Connection Error';
    }
  }

  function changeDate(direction) {
    currentDateIndex += direction;
    if (currentDateIndex < 0) currentDateIndex = 0;
    if (currentDateIndex >= dates.length) currentDateIndex = dates.length - 1;
    activeShowIndexOnDate = 0;
    renderCurrentDate();
  }

  function selectSubShow(index) {
    activeShowIndexOnDate = index;
    renderCurrentDate();
  }

  function populatePanel(panelId, groupKeys, activeShow) {
    const container = document.getElementById(panelId);
    container.innerHTML = '';
    
    if (groupKeys.length === 0) {
      container.innerHTML = `<div class="data-group full-width"><div class="data-value empty-val">No data</div></div>`;
      return;
    }
    
    groupKeys.forEach(h => {
      const val = activeShow[h];
      const displayVal = (val && val.trim() !== '' && val !== '-') ? val : '<span class="empty-val">—</span>';
      const isFullWidth = (h.toLowerCase().includes('note') || h.toLowerCase().includes('setup') || panelId === 'panel-post');
      
      container.innerHTML += `
        <div class="data-group ${isFullWidth ? 'full-width' : ''}">
          <div class="data-label">${h}</div>
          <div class="data-value">${displayVal}</div>
        </div>
      `;
    });
  }

  function getCleanValue(obj, keyword) {
    const key = headers.find(h => h.toLowerCase().includes(keyword));
    const val = key ? obj[key] : '';
    return (val && val.trim() !== '' && val !== '-') ? val : '—';
  }

  function renderCurrentDate() {
    if (dates.length === 0) return;
    const currentDate = dates[currentDateIndex];
    const shows = showsByDate[currentDate];
    
    const banner = document.getElementById('double-show-banner');
    const selectorContainer = document.getElementById('show-selector-buttons');
    
    if (shows.length > 1) {
      banner.style.display = 'flex';
      selectorContainer.innerHTML = '';
      shows.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.innerText = `Show ${idx + 1}: ${s[headers[titleIndex]].substring(0, 15)}...`;
        if (idx === activeShowIndexOnDate) btn.className = 'active-btn';
        btn.onclick = () => selectSubShow(idx);
        selectorContainer.appendChild(btn);
      });
    } else {
      banner.style.display = 'none';
      activeShowIndexOnDate = 0;
    }

    const activeShow = shows[activeShowIndexOnDate];
    document.getElementById('show-title-display').innerText = activeShow[headers[titleIndex]] || 'Unnamed Show';
    
    // Inject Meta Variables (Date, Promotor, Rep)
    document.getElementById('meta-date').innerText = currentDate;
    document.getElementById('meta-promotor').innerText = getCleanValue(activeShow, 'promot');
    document.getElementById('meta-rep').innerText = getCleanValue(activeShow, 'rep');

    // Populate panels
    populatePanel('panel-staff', headerGroups.staff, activeShow);
    populatePanel('panel-access', headerGroups.access, activeShow);
    populatePanel('panel-parking', headerGroups.parking, activeShow);
    populatePanel('panel-risers', headerGroups.risers, activeShow);
    populatePanel('panel-audiolx', headerGroups.audiolx, activeShow);
    populatePanel('panel-post', headerGroups.post, activeShow);
  }

  fetchData();
  setInterval(fetchData, 300000); 
</script>
</body>
</html>

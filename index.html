<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Tech Dashboard</title>
<style>
  :root {
    --bg-main: #0a0b10;
    --bg-panel: #12141d;
    --bg-panel-header: #1a1d27;
    --text-main: #ffffff;
    --text-muted: #8b949e;
    --accent-blue: #3b82f6;
    --accent-purple: #8b5cf6;
    --border-color: #2d3748;
  }
  body {
    margin: 0;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  #top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background-color: #11141e;
    border-bottom: 1px solid var(--border-color);
    height: 60px;
  }
  .nav-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  button {
    background: #1f2937;
    color: white;
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.2s;
  }
  button:hover:not(:disabled) { background: #374151; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .active-btn { background: var(--accent-blue); border-color: var(--accent-blue); }
  
  #double-show-banner {
    display: none;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.3);
    margin: 15px 20px 0;
    padding: 10px 15px;
    border-radius: 8px;
    align-items: center;
    justify-content: space-between;
  }
  .banner-text {
    color: var(--accent-purple);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .show-selector { display: flex; gap: 10px; }

  #main-content {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow: hidden;
  }
  #show-title-display {
    font-size: 42px;
    font-weight: 900;
    margin: 0;
    padding: 0 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 1fr;
    gap: 20px;
    flex: 1;
    min-height: 0;
  }
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    background: var(--bg-panel-header);
    padding: 10px 15px;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border-color);
  }
  .panel-content {
    padding: 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow-y: auto;
  }
  .data-group {
    background: #0d0f16;
    border: 1px solid #1f2937;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }
  .data-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .empty-val { color: #4b5563; }
</style>
</head>
<body>

<div id="top-nav">
  <div class="nav-title">
    <span style="background: var(--accent-blue); padding: 4px 8px; border-radius: 4px; color: white;">TECH DASHBOARD</span>
    <span id="loaded-status" style="font-size: 12px; color: var(--text-muted); font-weight: normal;">Loading data...</span>
  </div>
  <div class="nav-controls">
    <button onclick="changeDate(-1)">&#8592; Prev</button>
    <button class="active-btn" id="date-display">Date</button>
    <button onclick="changeDate(1)">Next &#8594;</button>
  </div>
</div>

<div id="double-show-banner">
  <div class="banner-text">DOUBLE SHOW DAY &mdash; Multiple events on this date:</div>
  <div class="show-selector" id="show-selector-buttons"></div>
</div>

<div id="main-content">
  <h1 id="show-title-display">Loading Show...</h1>
  <div class="dashboard-grid" id="dynamic-grid"></div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTgVZRHRjrtZCMkzzd8bIlSqVE81Yori6toV_peAXIrn1gzuJXJvRhv8kixtnPrNyJac73k5SBwys7N/pub?gid=0&single=true&output=csv';
  
  let showsByDate = {};
  let dates = [];
  let currentDateIndex = 0;
  let activeShowIndexOnDate = 0;
  let headers = [];
  let dateIndex = -1;
  let titleIndex = -1;

  function parseCSV(text) {
    let lines = [];
    let currentLine = [];
    let currentCell = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], nc = text[i+1];
      if (c === '"' && inQuotes && nc === '"') { currentCell += '"'; i++; }
      else if (c === '"') { inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes) { currentLine.push(currentCell.trim()); currentCell = ''; }
      else if ((c === '\n' || (c === '\r' && nc === '\n')) && !inQuotes) {
        currentLine.push(currentCell.trim());
        lines.push(currentLine);
        currentLine = []; currentCell = '';
        if (c === '\r') i++;
      } else { currentCell += c; }
    }
    if (currentCell || currentLine.length > 0) {
      currentLine.push(currentCell.trim());
      lines.push(currentLine);
    }
    return lines;
  }

  async function fetchData() {
    try {
      const response = await fetch(CSV_URL);
      const data = await response.text();
      const rows = parseCSV(data);
      if (rows.length < 2) return;

      headers = rows[0];
      
      // Find Date and Show Name to exclude them from the panels and use them in the header
      dateIndex = headers.findIndex(h => h.toLowerCase().includes('date'));
      titleIndex = headers.findIndex(h => h.toLowerCase().includes('show') && !h.toLowerCase().includes('post'));
      
      if (dateIndex === -1) dateIndex = 0;
      if (titleIndex === -1) titleIndex = 1;

      showsByDate = {};
      let loadedCount = 0;
      
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].length < 2 || !rows[i].join('').trim()) continue;
        
        const r = rows[i];
        const dateKey = r[dateIndex] || 'Unscheduled';
        
        let show = {};
        headers.forEach((h, idx) => {
          show[h] = r[idx] || '';
        });

        if (!showsByDate[dateKey]) showsByDate[dateKey] = [];
        showsByDate[dateKey].push(show);
        loadedCount++;
      }

      dates = Object.keys(showsByDate);
      document.getElementById('loaded-status').innerText = `Loaded (${loadedCount} Shows)`;
      
      if (dates.length > 0) {
        renderCurrentDate();
      } else {
        document.getElementById('show-title-display').innerText = 'Sheet is empty';
      }
    } catch (error) {
      document.getElementById('show-title-display').innerText = 'Connection Error';
    }
  }

  function changeDate(direction) {
    currentDateIndex += direction;
    if (currentDateIndex < 0) currentDateIndex = 0;
    if (currentDateIndex >= dates.length) currentDateIndex = dates.length - 1;
    activeShowIndexOnDate = 0;
    renderCurrentDate();
  }

  function selectSubShow(index) {
    activeShowIndexOnDate = index;
    renderCurrentDate();
  }

  function formatVal(val) {
    return (val && val.trim() !== '' && val !== '-') ? val : '<span class="empty-val">—</span>';
  }

  function renderCurrentDate() {
    if (dates.length === 0) return;
    const currentDate = dates[currentDateIndex];
    document.getElementById('date-display').innerText = currentDate;

    const shows = showsByDate[currentDate];
    const banner = document.getElementById('double-show-banner');
    const selectorContainer = document.getElementById('show-selector-buttons');
    
    if (shows.length > 1) {
      banner.style.display = 'flex';
      selectorContainer.innerHTML = '';
      shows.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.innerText = `Show ${idx + 1}: ${s[headers[titleIndex]].substring(0, 15)}...`;
        if (idx === activeShowIndexOnDate) btn.className = 'active-btn';
        btn.onclick = () => selectSubShow(idx);
        selectorContainer.appendChild(btn);
      });
    } else {
      banner.style.display = 'none';
      activeShowIndexOnDate = 0;
    }

    const activeShow = shows[activeShowIndexOnDate];
    document.getElementById('show-title-display').innerText = activeShow[headers[titleIndex]] || 'Unnamed Show';

    // Dynamically generate grid panels for all other columns
    const grid = document.getElementById('dynamic-grid');
    grid.innerHTML = '';
    
    let panelCount = 1;
    headers.forEach((h, idx) => {
      // Skip the designated Date and Title columns
      if (idx === dateIndex || idx === titleIndex) return;
      if (!h.trim()) return; // Skip completely empty header columns

      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.innerHTML = `
        <div class="panel-header">${panelCount} &bull; ${h}</div>
        <div class="panel-content">
          <div class="data-group">
            <div class="data-value">${formatVal(activeShow[h])}</div>
          </div>
        </div>
      `;
      grid.appendChild(panel);
      panelCount++;
    });
  }

  fetchData();
  setInterval(fetchData, 300000); 
</script>
</body>
</html>

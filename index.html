<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Tech Dashboard</title>
<style>
  :root {
    --bg-main: #06070a;
    --bg-panel: #10121a;
    --text-main: #ffffff;
    --text-muted: #8b949e;
    --accent-blue: #3b82f6;
    --accent-purple: #8b5cf6;
    --border-color: #2d3748;
  }
  body {
    margin: 0;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    /* Soft ambient background glow */
    background-image: radial-gradient(circle at 50% 0%, rgba(20, 25, 40, 1) 0%, rgba(6, 7, 10, 1) 80%);
  }
  
  /* Top Nav */
  #top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 16px;
    background-color: rgba(10, 12, 18, 0.7);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    height: 42px;
    backdrop-filter: blur(10px);
  }
  .nav-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  #double-show-container {
    display: none;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.3);
    padding: 4px 10px;
    border-radius: 6px;
    align-items: center;
    gap: 10px;
  }
  .banner-text {
    color: var(--accent-purple);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .show-selector { display: flex; gap: 6px; }

  .nav-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    background: rgba(255, 255, 255, 0.05);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 11px;
    transition: all 0.2s;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .active-btn { 
    background: rgba(59, 130, 246, 0.2); 
    border-color: rgba(59, 130, 246, 0.5); 
    color: #60a5fa;
  }
  
  #main-content {
    flex: 1;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden; 
  }
  
  /* Header Layout */
  #show-header-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 0;
    flex-wrap: nowrap;
  }
  #show-title-display {
    flex: 0 0 auto;
    max-width: 30%;
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 900;
    margin: 0;
    line-height: 1.1;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  
  /* Meta Area */
  #show-meta-area {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden; 
  }
  .meta-item {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    padding: 5px 12px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    white-space: nowrap;
  }
  .meta-label {
    font-size: clamp(8px, 1vh, 9px);
    color: var(--accent-blue);
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .meta-value {
    font-size: clamp(12px, 1.8vh, 15px);
    font-weight: 600;
    color: var(--text-main);
  }

  /* Structural Columns */
  .dashboard-columns {
    display: flex;
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .column {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-width: 0;
  }

  /* --- AESTHETIC PANEL UPGRADES --- */
  .panel {
    background-color: var(--bg-panel);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden; 
    /* Soft Faded Edge Effect */
    border: 1px solid rgba(255,255,255,0.03);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
  }
  
  .panel-flexible { flex: 1 1 auto; }
  
  /* Color Theme: Staff (Blue) */
  .panel-color-staff {
    background: linear-gradient(145deg, rgba(59, 130, 246, 0.08) 0%, var(--bg-panel) 50%);
    border-top: 1px solid rgba(59, 130, 246, 0.2);
  }
  .panel-color-staff .panel-header { color: #60a5fa; border-bottom: 1px solid rgba(59, 130, 246, 0.15); }

  /* Color Theme: Parking (Green) */
  .panel-color-parking {
    background: linear-gradient(145deg, rgba(16, 185, 129, 0.08) 0%, var(--bg-panel) 50%);
    border-top: 1px solid rgba(16, 185, 129, 0.2);
  }
  .panel-color-parking .panel-header { color: #34d399; border-bottom: 1px solid rgba(16, 185, 129, 0.15); }

  /* Color Theme: Audio/LX (Purple) */
  .panel-color-audiolx {
    background: linear-gradient(145deg, rgba(139, 92, 246, 0.08) 0%, var(--bg-panel) 50%);
    border-top: 1px solid rgba(139, 92, 246, 0.2);
  }
  .panel-color-audiolx .panel-header { color: #a78bfa; border-bottom: 1px solid rgba(139, 92, 246, 0.15); }

  /* Color Theme: Post-Show (Amber) */
  .panel-color-post {
    background: linear-gradient(145deg, rgba(245, 158, 11, 0.08) 0%, var(--bg-panel) 50%);
    border-top: 1px solid rgba(245, 158, 11, 0.2);
  }
  .panel-color-post .panel-header { color: #fbbf24; border-bottom: 1px solid rgba(245, 158, 11, 0.15); }

  .panel-header {
    background: rgba(0, 0, 0, 0.2); /* Lets the gradient shine through */
    padding: 6px 12px;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  /* --- Strict Grid System --- */
  .panel-grid-layout {
    padding: 10px;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr; 
    align-content: flex-start;
    gap: 8px; 
    overflow: hidden; 
  }
  
  /* --- Strict Flex Row for Staff --- */
  .panel-staff-row {
    padding: 10px;
    flex: 1;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap; 
    align-items: stretch;
    gap: 8px;
  }

  /* Box styling */
  .data-group {
    background: rgba(0, 0, 0, 0.35); /* Darker inset embedded look */
    border: 1px solid rgba(255, 255, 255, 0.02);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.15);
    border-radius: 6px;
    padding: clamp(4px, 1vh, 8px) 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }
  
  /* Grid sizing classes */
  .span-1 { grid-column: span 1; }
  .span-2 { grid-column: span 2; }
  .staff-item { flex: 1; } 

  .data-label {
    font-size: clamp(7px, 0.9vh, 8.5px);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .data-value {
    font-size: clamp(10.5px, 1.4vh, 13px);
    font-weight: 600;
    color: var(--text-main);
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.2;
  }
  .empty-val { color: #4b5563; font-weight: 400; }
</style>
</head>
<body>

<div id="top-nav">
  <div class="nav-title">
    <span style="background: rgba(59,130,246,0.3); padding: 3px 6px; border-radius: 4px; color: #60a5fa; font-size: 11px; border: 1px solid rgba(59,130,246,0.5);">TECH DASHBOARD</span>
    <span id="loaded-status" style="font-size: 11px; color: var(--text-muted); font-weight: normal;">Loading data...</span>
  </div>
  
  <div id="double-show-container">
    <span class="banner-text">Multiple events on this date:</span>
    <div class="show-selector" id="show-selector-buttons"></div>
  </div>

  <div class="nav-controls">
    <button onclick="changeDate(-1)">&#8592; Prev Day</button>
    <button onclick="changeDate(1)">Next Day &#8594;</button>
  </div>
</div>

<div id="main-content">
  <div id="show-header-area">
    <h1 id="show-title-display">Loading Show...</h1>
    <div id="show-meta-area"></div>
  </div>
  
  <div class="dashboard-columns">
    <!-- LEFT COLUMN -->
    <div class="column">
      <div class="panel panel-flexible panel-color-staff" style="flex: 0 1 auto;"> 
        <div class="panel-header">1 &bull; Staff on the Day</div>
        <div class="panel-staff-row" id="panel-staff"></div>
      </div>
      <div class="panel panel-flexible panel-color-parking">
        <div class="panel-header">3 &bull; Parking, Admin & Extra Notes</div>
        <div class="panel-grid-layout" id="panel-parking"></div>
      </div>
    </div>
    
    <!-- RIGHT COLUMN -->
    <div class="column">
      <div class="panel panel-flexible panel-color-audiolx">
        <div class="panel-header">2 &bull; Audio, LX, Risers & Supports</div>
        <div class="panel-grid-layout" id="panel-audiolx"></div>
      </div>
      <div class="panel panel-flexible panel-color-post">
        <div class="panel-header">4 &bull; Post-Show Setup Instructions</div>
        <div class="panel-grid-layout" id="panel-post"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTgVZRHRjrtZCMkzzd8bIlSqVE81Yori6toV_peAXIrn1gzuJXJvRhv8kixtnPrNyJac73k5SBwys7N/pub?gid=0&single=true&output=csv';
  
  let showsByDate = {};
  let dates = [];
  let currentDateIndex = 0;
  let activeShowIndexOnDate = 0;
  
  let headers = [];
  let dateIndex = -1;
  let titleIndex = -1;
  
  let headerGroups = { staff: [], parking: [], audiolx: [], post: [] };
  
  function isHeaderMeta(h) {
    const lower = h.toLowerCase();
    if (lower.includes('access') && lower.includes('tech')) return false; 
    if (lower.includes('access')) return true; 
    const metaKw = ['promot', 'rep', 'door', 'load', 'fire cert', 'show stop', 'foh riser', 'accreditation'];
    return metaKw.some(kw => lower.includes(kw));
  }

  function parseCSV(text) {
    let lines = [];
    let currentLine = [];
    let currentCell = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], nc = text[i+1];
      if (c === '"' && inQuotes && nc === '"') { currentCell += '"'; i++; }
      else if (c === '"') { inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes) { currentLine.push(currentCell.trim()); currentCell = ''; }
      else if ((c === '\n' || (c === '\r' && nc === '\n')) && !inQuotes) {
        currentLine.push(currentCell.trim());
        lines.push(currentLine);
        currentLine = []; currentCell = '';
        if (c === '\r') i++;
      } else { currentCell += c; }
    }
    if (currentCell || currentLine.length > 0) {
      currentLine.push(currentCell.trim());
      lines.push(currentLine);
    }
    return lines;
  }

  function groupHeadersByKeyword() {
    headerGroups = { staff: [], parking: [], audiolx: [], post: [] };
    
    headers.forEach((h, idx) => {
      if (idx === dateIndex || idx === titleIndex || !h.trim()) return;
      if (isHeaderMeta(h)) return;
      
      const lower = h.toLowerCase();
      if (lower.match(/post|setup|night/)) {
        headerGroups.post.push(h);
      } else if (lower.match(/tech|crew|runner|manager|staff/)) {
        headerGroups.staff.push(h);
      } else if (lower.match(/audio|lx|light|power|sfx|riser|drum|support/)) {
        headerGroups.audiolx.push(h);
      } else {
        headerGroups.parking.push(h); 
      }
    });
  }

  async function fetchData() {
    try {
      const response = await fetch(CSV_URL);
      const data = await response.text();
      const rows = parseCSV(data);
      if (rows.length < 2) return;

      headers = rows[0];
      
      dateIndex = headers.findIndex(h => h.toLowerCase().includes('date'));
      titleIndex = headers.findIndex(h => h.toLowerCase().includes('show') && !h.toLowerCase().includes('post'));
      if (dateIndex === -1) dateIndex = 0;
      if (titleIndex === -1) titleIndex = 1;

      groupHeadersByKeyword();
      showsByDate = {};
      let loadedCount = 0;
      
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].length < 2 || !rows[i].join('').trim()) continue;
        const r = rows[i];
        const dateKey = r[dateIndex] || 'Unscheduled';
        
        let show = {};
        headers.forEach((h, idx) => { show[h] = r[idx] || ''; });

        if (!showsByDate[dateKey]) showsByDate[dateKey] = [];
        showsByDate[dateKey].push(show);
        loadedCount++;
      }

      dates = Object.keys(showsByDate);
      document.getElementById('loaded-status').innerText = `Loaded (${loadedCount} Shows)`;
      
      if (dates.length > 0) renderCurrentDate();
      else document.getElementById('show-title-display').innerText = 'Sheet is empty';
    } catch (error) {
      document.getElementById('show-title-display').innerText = 'Connection Error';
    }
  }

  function changeDate(direction) {
    currentDateIndex += direction;
    if (currentDateIndex < 0) currentDateIndex = 0;
    if (currentDateIndex >= dates.length) currentDateIndex = dates.length - 1;
    activeShowIndexOnDate = 0;
    renderCurrentDate();
  }

  function selectSubShow(index) {
    activeShowIndexOnDate = index;
    renderCurrentDate();
  }

  function populatePanel(panelId, groupKeys, activeShow) {
    const container = document.getElementById(panelId);
    container.innerHTML = '';
    
    if (groupKeys.length === 0) {
      container.innerHTML = `<div class="data-group span-2"><div class="data-value empty-val">No data available</div></div>`;
      return;
    }

    function getSortRank(h) {
      const lower = h.toLowerCase().trim();
      
      if (panelId === 'panel-parking') {
        if (lower === 'parking' || (lower.includes('parking') && !lower.includes('code'))) return 1;
        if (lower.includes('parking code')) return 2;
        if (lower.includes('stage time')) return 3;
        if (lower.includes('stage towel')) return 4;
        if (lower.includes('bath towel')) return 5;
        if (lower.includes('note')) return 6;
        if (lower.includes('hire')) return 7;
      } 
      else if (panelId === 'panel-audiolx') {
        if (lower === 'audio' || (lower.includes('audio') && !lower.includes('power'))) return 1;
        if (lower.includes('light') || lower.includes('sfx') || (lower.includes('lx') && !lower.includes('power'))) return 2;
        if (lower.includes('audio power')) return 3;
        if (lower.includes('lx power')) return 4;
        if (lower.includes('riser')) return 5;
        if (lower.includes('support')) return 6;
      }
      return 99;
    }

    groupKeys.sort((a, b) => getSortRank(a) - getSortRank(b));
    
    const halfWidthMatches = ['parking', 'parking code', 'lx power', 'audio power', 'stage towels', 'bath towels'];
    
    groupKeys.forEach(h => {
      const val = activeShow[h];
      const displayVal = (val && val.trim() !== '' && val !== '-') ? val : '<span class="empty-val">—</span>';
      const lower = h.toLowerCase().trim();
      
      let cssClass = 'span-2'; 
      
      if (panelId === 'panel-staff') {
        cssClass = 'staff-item';
      } else if (halfWidthMatches.some(kw => lower.includes(kw))) {
        cssClass = 'span-1';
      }
      
      container.innerHTML += `
        <div class="data-group ${cssClass}">
          <div class="data-label">${h}</div>
          <div class="data-value">${displayVal}</div>
        </div>
      `;
    });
  }

  function createMetaBadge(label, value) {
    const displayVal = (value && value.trim() !== '' && value !== '-') ? value : '<span class="empty-val">—</span>';
    return `
      <div class="meta-item">
        <span class="meta-label">${label}</span>
        <span class="meta-value">${displayVal}</span>
      </div>
    `;
  }

  function renderCurrentDate() {
    if (dates.length === 0) return;
    const currentDate = dates[currentDateIndex];
    const shows = showsByDate[currentDate];
    
    const bannerContainer = document.getElementById('double-show-container');
    const selectorContainer = document.getElementById('show-selector-buttons');
    
    if (shows.length > 1) {
      bannerContainer.style.display = 'flex';
      selectorContainer.innerHTML = '';
      shows.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.innerText = `Show ${idx + 1}: ${s[headers[titleIndex]].substring(0, 15)}...`;
        if (idx === activeShowIndexOnDate) btn.className = 'active-btn';
        btn.onclick = () => selectSubShow(idx);
        selectorContainer.appendChild(btn);
      });
    } else {
      bannerContainer.style.display = 'none';
      activeShowIndexOnDate = 0;
    }

    const activeShow = shows[activeShowIndexOnDate];
    document.getElementById('show-title-display').innerText = activeShow[headers[titleIndex]] || 'Unnamed Show';
    
    const metaContainer = document.getElementById('show-meta-area');
    metaContainer.innerHTML = createMetaBadge('Date', currentDate);
    
    headers.forEach(h => {
      if (h !== headers[dateIndex] && h !== headers[titleIndex] && isHeaderMeta(h)) {
        metaContainer.innerHTML += createMetaBadge(h, activeShow[h]);
      }
    });

    populatePanel('panel-staff', headerGroups.staff, activeShow);
    populatePanel('panel-audiolx', headerGroups.audiolx, activeShow);
    populatePanel('panel-parking', headerGroups.parking, activeShow);
    populatePanel('panel-post', headerGroups.post, activeShow);
  }

  fetchData();
  setInterval(fetchData, 300000); 
</script>
</body>
</html>
